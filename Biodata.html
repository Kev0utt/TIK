<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Kanisian - Ignatius Kevin Wijaya</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-kanisius {
            margin: 40px 0 30px;
        }

        .card {
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }

        .card-header {
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            padding: 12px 20px;
        }
        
        .badge {
            font-size: 0.85em;
            padding: 8px 12px;
            margin: 3px;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="text-center header-kanisius">
        <h1 class="fw-bold text-uppercase text-secondary mb-2">
            <i class="bi bi-person-badge"></i> Biodata Kanisian
        </h1>
        <p class="lead fst-italic text-muted mb-4">
            "Pelajar Kolese Kanisius Angkatan CC27"
        </p>
        <hr class="w-50 mx-auto border-2 border-secondary opacity-50">
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card border-1 border-secondary">
                <div class="card-header bg-secondary text-white text-center fw-semibold">
                    <i class="bi bi-info-circle me-1"></i> Biodata
                </div>
                <div class="card-body">
                    <ul class="list-unstyled mb-0 lh-lg">
                        <li><strong><i class="bi bi-person me-2"></i>Nama:</strong> Ignatius Kevin Wijaya</li>
                        <li><strong><i class="bi bi-building me-2"></i>Kelas:</strong> XIA5</li>
                        <li><strong><i class="bi bi-hash me-2"></i>No. Absen:</strong> 17</li>
                        <li><strong><i class="bi bi-mortarboard me-2"></i>Angkatan:</strong> CC 2027</li>
                        <li><strong><i class="bi bi-geo-alt me-2"></i>Domisili:</strong> Jakarta Utara</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-1 border-success">
                <div class="card-header bg-success text-white text-center fw-semibold">
                    <i class="bi bi-emoji-smile me-1"></i> Kepribadian
                </div>
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <p class="text-muted mb-3"><em>Ya gitulah</em></p>
                    <div>
                        <span class="badge bg-primary-subtle text-primary rounded-pill border border-primary">Pantang menyerah</span>
                        <span class="badge bg-primary-subtle text-primary rounded-pill border border-primary">Rajin</span>
                        <span class="badge bg-primary-subtle text-primary rounded-pill border border-primary">Peduli</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-1 border-warning">
                <div class="card-header bg-warning text-dark text-center fw-semibold">
                    <i class="bi bi-controller me-1"></i> Hobi
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush rounded-bottom-3">
                        <li class="list-group-item bg-transparent py-3"><i class="bi bi-dribbble text-warning me-2"></i> Voli</li>
                        <li class="list-group-item bg-transparent py-3"><i class="bi bi-joystick text-warning me-2"></i> Main game</li>
                        <li class="list-group-item bg-transparent py-3"><i class="bi bi-book text-warning me-2"></i> Membaca Buku</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

    <div class="d-flex justify-content-center mt-5 mb-4">
        <div class="btn-group btn-group-lg shadow-sm" role="group" aria-label="Aksi Profil">
            <button class="btn btn-outline-danger fw-semibold px-4"><i class="bi bi-heart me-1"></i> Like</button>
            <button class="btn btn-outline-primary fw-semibold px-4"><i class="bi bi-send me-1"></i> Post</button>
            <button class="btn btn-outline-dark fw-semibold px-4"><i class="bi bi-arrow-left me-1"></i> Back</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
